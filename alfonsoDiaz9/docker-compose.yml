services:
  dbprueba9:
    image: postgres:15-alpine
    container_name: dbprueba9
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - dbdata9:/var/lib/postgresql/data
    networks:
      - erp_net

  app9:
    build: .
    container_name: app9
    env_file: .env
    volumes:
      - .:/app_sales
    networks:
      - erp_net
    depends_on:
      - dbprueba9

  proxy9:
    image: nginx:alpine
    container_name: proxy9
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - erp_net
    depends_on:
      - app9

volumes:
  dbdata9:

networks:
  erp_net:
    driver: bridge
